<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Valheim Solo Toolkit</title>
  <desc id="desc">Your world. Your rules. Inventory, player powers, movement and teleport tools in one dark interface.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10251f"/><stop offset=".55" stop-color="#141c24"/><stop offset="1" stop-color="#202033"/></linearGradient>
    <linearGradient id="edge"><stop stop-color="#60df9c"/><stop offset=".5" stop-color="#80d8e8"/><stop offset="1" stop-color="#e8cc8d"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#60df9c" stop-opacity=".15"/><stop offset="1" stop-color="#60df9c" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="398" rx="19" fill="none" stroke="#35443f"/>
  <circle cx="1090" cy="170" r="260" fill="url(#glow)"/>
  <g fill="none" stroke="#80d8e8" stroke-opacity=".15">
    <circle cx="1090" cy="166" r="113"/><circle cx="1090" cy="166" r="88"/>
    <path d="M1090 28v276M952 166h276M1010 86l160 160M1010 246l160-160"/>
  </g>
  <path d="M1090 65l24 76 76 25-76 25-24 76-24-76-76-25 76-25z" fill="#80d8e8" fill-opacity=".08" stroke="#80d8e8" stroke-opacity=".65"/>
  <path d="M1090 101l14 51 51 14-51 14-14 51-14-51-51-14 51-14z" fill="none" stroke="#e8cc8d"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="64" y="66" font-size="13" font-weight="700" letter-spacing="3" fill="#60df9c">BUILT FOR SOLO ADVENTURES</text>
    <text x="60" y="145" font-size="64" font-weight="700" letter-spacing="-2" fill="#f4f6f7">Valheim Solo Toolkit</text>
    <text x="64" y="190" font-size="26" fill="#e8cc8d">Your world. Your rules.</text>
    <text x="64" y="231" font-size="18" fill="#b2bec5">Less inventory work. More time to explore, build and experiment.</text>
    <g font-size="13" font-weight="600">
      <rect x="64" y="283" width="138" height="36" rx="18" fill="#203e30"/><text x="133" y="306" text-anchor="middle" fill="#82edb0">INVENTORY</text>
      <rect x="214" y="283" width="166" height="36" rx="18" fill="#253547"/><text x="297" y="306" text-anchor="middle" fill="#9dcdf4">PLAYER POWERS</text>
      <rect x="392" y="283" width="164" height="36" rx="18" fill="#343044"/><text x="474" y="306" text-anchor="middle" fill="#c9b5ef">TELEPORT TOOLS</text>
      <rect x="568" y="283" width="160" height="36" rx="18" fill="#3b3528"/><text x="648" y="306" text-anchor="middle" fill="#e8cc8d">SKILLS &amp; FLIGHT</text>
    </g>
    <text x="64" y="365" font-size="13" fill="#899ba5">WINDOWS  ·  CHEAT ENGINE 7.6  ·  DARK INTERFACE</text>
  </g>
  <rect x="64" y="397" width="1152" height="3" fill="url(#edge)"/>
